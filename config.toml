###################################
#      Experimental settings      #
###################################
[experimental]
# If true, SNI consistency check between TLS ClientHello and HTTP Host header is ignored.
# Keep false unless you have a specific reason.
ignore_sni_consistency = false

# Force connection handling timeout in seconds. 0 = infinite. [default: 0]
# connection_handling_timeout = 0

# Uncomment to enable HTTP/3 (QUIC)
# [experimental.h3]
# alt_svc_max_age = 3600
# request_max_body_size = 65536
# max_concurrent_connections = 10000
# max_concurrent_bidistream = 100
# max_concurrent_unistream = 100
# max_idle_timeout = 10
